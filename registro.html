  </header>
  
  <main class="main-login">

    <form class="form-container" id="formulario">
      <h3>Registro de usuario</h3>
      <h4>Nombre Completo</h4>
      <input type="text" id="regNombre" required>
      <h4>Correo</h4>
      <input type="email" id="regCorreo" required>
      <h4>Confirmar Correo</h4>
      <input type="email" id="regConfirmarCorreo" required>
      <h4>Constraseña</h4>
      <input type="password" id="regContraseña" required>
      <h4>Confirmar Contraseña</h4>
      <input type="password" id="regConfirmContraseña" required>
      <h4>Telefono (opcional)</h4>
      <input type="tel" id="regTelefono">

      <div class="select-container">
        <select name="region" id="sel-region">
          <option value="">Seleccione la Region</option>
        </select>

        <select name="comuna" id="sel-comuna">
          <option value="">Seleccione la Comuna</option>
        </select>
      </div>

      <button type="submit">Registrar</button>
    </form>

  </main>

  <footer>

  </footer>

  <script src="js/regiones.js"></script>
