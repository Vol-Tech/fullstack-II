<body>

  <header>
    <nav class="nav-tab">
      <a href="index.html">
        <img src="img/VolTech Logo - Sin texto.png" alt="icono-tab">
      </a>
      <ul>

        <li><a class="icono-carrito" href="#"></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="contacto-encabezado">
      <img src="img/VolTech Logo - Sin texto.png" alt="Logo Vol">
      <h1>VolTech</h1>
    </div>
    <div class="contacto-contenedor">
      <section class="contacto-tarjeta">
        <div class="contacto-titulo">
          <h3>FORMULARIO DE CONTACTOS</h3>
        </div>
        <!-- Agregue no validate ya que trata de validar el @ y no estoy seguro de usar esa opcion-->
        <form id="formulario-contacto" class="contacto-form" novalidate>

          <div class="grupo-input">
            <label for="nombre">NOMBRE COMPLETO</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre completo">
          </div>

          <div class="grupo-input">
            <label for="correo">CORREO</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo electronico">
          </div>

          <div class="grupo-input">
            <label for="contenido">CONTENIDO</label>
            <input type="contenido" id="contenido" placeholder="Diganos cual es su caso para contactarnos">
          </div>

          <button>ENVIAR</button>
        </form>
      </section>
    </div>
  </main>
</body>
